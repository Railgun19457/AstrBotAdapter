plugins { id 'net.fabricmc.fabric-loom' version '1.17.18' }

version = rootProject.version

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    include 'org.java-websocket:Java-WebSocket:1.5.7'
}

sourceSets.main.java {
    srcDir rootProject.file('src/main/java')
    exclude '**/paper/**'
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
processResources {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
jar { archiveBaseName = 'AstrBotAdapter-Fabric' }
